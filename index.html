<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iPod Classic</title>
<link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600&family=Chicago&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #000;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, 'Helvetica Neue', sans-serif;
    overflow: hidden;
  }

  /* Ambient glow behind iPod */
  body::before {
    content: '';
    position: fixed;
    width: 340px; height: 340px;
    background: radial-gradient(ellipse, rgba(180,180,200,0.12) 0%, transparent 70%);
    top: 50%; left: 50%;
    transform: translate(-50%, -52%);
    pointer-events: none;
    z-index: 0;
  }

  /* ── iPod shell ── */
  .ipod {
    position: relative;
    width: 242px;
    background: linear-gradient(175deg, #e8e8ea 0%, #d0d0d4 30%, #c8c8cc 60%, #b8b8bc 100%);
    border-radius: 32px;
    padding: 18px 18px 28px;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.55) inset,
      0 1px 0 rgba(255,255,255,0.9) inset,
      0 -1px 0 rgba(0,0,0,0.18) inset,
      1px 0 0 rgba(255,255,255,0.6) inset,
      -1px 0 0 rgba(0,0,0,0.12) inset,
      0 40px 80px rgba(0,0,0,0.85),
      0 20px 40px rgba(0,0,0,0.6),
      0 8px 16px rgba(0,0,0,0.4);
    z-index: 1;
    user-select: none;
  }

  /* Side edge shine */
  .ipod::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 32px;
    background: linear-gradient(90deg,
      rgba(255,255,255,0.4) 0%,
      transparent 15%,
      transparent 85%,
      rgba(0,0,0,0.15) 100%
    );
    pointer-events: none;
  }

  /* Top highlight strip */
  .ipod::after {
    content: '';
    position: absolute;
    top: 0; left: 20px; right: 20px;
    height: 50px;
    background: linear-gradient(180deg, rgba(255,255,255,0.7) 0%, transparent 100%);
    border-radius: 32px 32px 0 0;
    pointer-events: none;
  }

  /* ── Screen bezel ── */
  .screen-bezel {
    background: #1a1a1e;
    border-radius: 6px;
    padding: 2px;
    margin-bottom: 22px;
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.8),
      0 2px 8px rgba(0,0,0,0.6) inset,
      0 1px 0 rgba(255,255,255,0.15);
    position: relative;
    z-index: 2;
  }

  /* ── Screen ── */
  .screen {
    background: #fff;
    border-radius: 4px;
    overflow: hidden;
    width: 100%;
    aspect-ratio: 4/3;
    position: relative;
    font-size: 11px;
  }

  /* Title bar */
  .title-bar {
    background: linear-gradient(180deg, #b8d4f0 0%, #8ab4e0 50%, #6090c8 51%, #8ab8e8 100%);
    padding: 2px 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #4a7ab0;
  }

  .title-bar-text {
    font-size: 10.5px;
    font-weight: 600;
    color: #fff;
    text-shadow: 0 1px 1px rgba(0,0,0,0.3);
    letter-spacing: 0.01em;
  }

  .title-bar-icons {
    display: flex;
    align-items: center;
    gap: 3px;
  }

  .play-icon {
    width: 0; height: 0;
    border-style: solid;
    border-width: 4px 0 4px 7px;
    border-color: transparent transparent transparent #4a9;
    filter: drop-shadow(0 0 1px rgba(0,200,100,0.6));
  }

  .battery {
    width: 18px; height: 10px;
    border: 1.5px solid #3a3;
    border-radius: 2px;
    position: relative;
    overflow: visible;
    background: transparent;
  }
  .battery::before {
    content: '';
    position: absolute;
    right: -4px; top: 50%;
    transform: translateY(-50%);
    width: 2.5px; height: 5px;
    background: #3a3;
    border-radius: 0 1px 1px 0;
  }
  .battery::after {
    content: '';
    position: absolute;
    inset: 1.5px;
    right: auto;
    width: 80%;
    background: linear-gradient(90deg, #4c4, #6e6);
    border-radius: 1px;
  }

  /* Now playing content */
  .np-content {
    display: flex;
    gap: 8px;
    padding: 7px 7px 5px;
    align-items: flex-start;
  }

  .album-art {
    width: 72px;
    height: 72px;
    flex-shrink: 0;
    border-radius: 2px;
    overflow: hidden;
    box-shadow: 1px 1px 4px rgba(0,0,0,0.3);
    background: #222;
    position: relative;
  }

  .album-art img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Fallback album art */
  .album-art-fallback {
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #c0392b 0%, #e74c3c 30%, #1a1a2e 60%, #16213e 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .album-art-fallback::before {
    content: '♪';
    font-size: 28px;
    color: rgba(255,255,255,0.4);
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
  }

  .np-info {
    flex: 1;
    min-width: 0;
  }

  .np-label {
    font-size: 8.5px;
    color: #888;
    margin-bottom: 2px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .np-song {
    font-size: 12px;
    font-weight: 700;
    color: #111;
    line-height: 1.2;
    margin-bottom: 3px;
    letter-spacing: -0.02em;
  }

  .np-artist {
    font-size: 10px;
    color: #444;
    line-height: 1.3;
    margin-bottom: 2px;
    font-weight: 500;
  }

  .np-album {
    font-size: 9.5px;
    color: #777;
    line-height: 1.3;
  }

  /* Progress bar area */
  .progress-area {
    padding: 4px 8px 7px;
    border-top: 1px solid #eee;
    margin-top: 2px;
  }

  .progress-bar-track {
    height: 5px;
    background: #d0d0d0;
    border-radius: 3px;
    margin-bottom: 3px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,0.15) inset;
    cursor: pointer;
    position: relative;
  }

  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #4a9de8, #5baef0);
    border-radius: 3px;
    width: 23%;
    transition: width 0.5s linear;
    position: relative;
  }

  .progress-bar-fill::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 50%;
    background: rgba(255,255,255,0.4);
    border-radius: 3px 3px 0 0;
  }

  .progress-times {
    display: flex;
    justify-content: space-between;
    font-size: 9px;
    color: #666;
    font-variant-numeric: tabular-nums;
    font-weight: 500;
  }

  /* ── Click Wheel ── */
  .wheel-zone {
    display: flex;
    justify-content: center;
    position: relative;
    z-index: 2;
  }

  .click-wheel {
    width: 156px;
    height: 156px;
    border-radius: 50%;
    position: relative;
    background: radial-gradient(circle at 38% 32%,
      #f8f8f8 0%,
      #e8e8ea 35%,
      #d4d4d8 65%,
      #c0c0c4 100%
    );
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.7) inset,
      0 4px 12px rgba(0,0,0,0.4),
      0 2px 4px rgba(0,0,0,0.25),
      0 8px 24px rgba(0,0,0,0.3);
  }

  /* Wheel rim highlight */
  .click-wheel::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(
      from 220deg,
      transparent 0deg,
      rgba(255,255,255,0.5) 30deg,
      transparent 80deg,
      transparent 200deg,
      rgba(255,255,255,0.3) 220deg,
      transparent 260deg
    );
    pointer-events: none;
  }

  /* ── Center button ── */
  .center-btn {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(1);
    width: 56px; height: 56px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 32%,
      #f6f6f8 0%,
      #dddde2 45%,
      #c8c8cc 100%
    );
    border: none;
    cursor: pointer;
    box-shadow:
      0 0 0 1.5px rgba(255,255,255,0.85) inset,
      0 -1.5px 0 rgba(0,0,0,0.22) inset,
      0 3px 8px rgba(0,0,0,0.32),
      0 1px 3px rgba(0,0,0,0.18);
    transition:
      transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1),
      box-shadow 0.18s cubic-bezier(0.34, 1.56, 0.64, 1),
      background 0.12s ease,
      filter 0.12s ease;
    z-index: 10;
    will-change: transform;
  }

  .center-btn.pressing {
    transform: translate(-50%, -50%) scale(0.91);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.5) inset,
      0 -0.5px 0 rgba(0,0,0,0.12) inset,
      0 1px 4px rgba(0,0,0,0.38),
      0 0.5px 1px rgba(0,0,0,0.25);
    background: radial-gradient(circle at 40% 35%,
      #e2e2e6 0%,
      #ccccce 45%,
      #b8b8bc 100%
    );
    filter: brightness(0.93);
    transition:
      transform 0.09s cubic-bezier(0.25, 0.46, 0.45, 0.94),
      box-shadow 0.09s ease,
      background 0.06s ease,
      filter 0.06s ease;
  }

  /* Wheel button zones */
  .wheel-btn {
    position: absolute;
    background: transparent;
    border: none;
    cursor: pointer;
    border-radius: 4px;
    transition: background 0.25s ease;
    -webkit-tap-highlight-color: transparent;
    outline: none;
  }

  .btn-menu {
    top: 4px; left: 50%;
    transform: translateX(-50%);
    width: 84px; height: 38px;
    border-radius: 6px 6px 2px 2px;
  }
  .btn-play {
    bottom: 4px; left: 50%;
    transform: translateX(-50%);
    width: 84px; height: 38px;
    border-radius: 2px 2px 6px 6px;
  }
  .btn-prev {
    left: 4px; top: 50%;
    transform: translateY(-50%);
    width: 38px; height: 84px;
    border-radius: 6px 2px 2px 6px;
  }
  .btn-next {
    right: 4px; top: 50%;
    transform: translateY(-50%);
    width: 38px; height: 84px;
    border-radius: 2px 6px 6px 2px;
  }

  /* Wheel segment press — uses an overlay pseudo on the wheel */
  .wheel-segment-overlay {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    pointer-events: none;
    overflow: hidden;
    z-index: 2;
  }

  /* The actual segment highlight */
  .seg-flash {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    opacity: 0;
    transition: opacity 0.22s ease;
    pointer-events: none;
  }
  .seg-flash.active {
    opacity: 1;
    transition: opacity 0.04s ease;
  }
  .seg-flash.releasing {
    opacity: 0;
    transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* Each segment: clip to its quadrant using clip-path */
  .seg-top    { background: radial-gradient(ellipse 70% 55% at 50% 20%, rgba(0,0,0,0.10) 0%, transparent 100%); }
  .seg-bottom { background: radial-gradient(ellipse 70% 55% at 50% 80%, rgba(0,0,0,0.10) 0%, transparent 100%); }
  .seg-left   { background: radial-gradient(ellipse 55% 70% at 20% 50%, rgba(0,0,0,0.10) 0%, transparent 100%); }
  .seg-right  { background: radial-gradient(ellipse 55% 70% at 80% 50%, rgba(0,0,0,0.10) 0%, transparent 100%); }

  /* Wheel labels */
  .wheel-label {
    position: absolute;
    font-size: 8.5px;
    font-weight: 600;
    color: #888;
    letter-spacing: 0.06em;
    pointer-events: none;
    text-shadow: 0 1px 0 rgba(255,255,255,0.85);
    transition: color 0.15s ease, text-shadow 0.15s ease;
    z-index: 6;
  }
  .wheel-label.lit {
    color: #555;
    text-shadow: 0 1px 2px rgba(255,255,255,1);
  }
  .label-menu { top: 13px;  left: 50%; transform: translateX(-50%); }
  .label-play { bottom: 11px; left: 50%; transform: translateX(-50%); }
  .label-prev { left: 12px; top: 50%; transform: translateY(-50%); }
  .label-next { right: 11px; top: 50%; transform: translateY(-50%); }

  /* Icons on wheel */
  .wheel-icon {
    position: absolute;
    color: #888;
    pointer-events: none;
    font-size: 11px;
    line-height: 1;
    text-shadow: 0 1px 0 rgba(255,255,255,0.9);
    transition: color 0.15s ease, text-shadow 0.15s ease;
    z-index: 6;
  }
  .wheel-icon.lit {
    color: #444;
    text-shadow: 0 1px 3px rgba(255,255,255,1);
  }
  .icon-play { bottom: 14px; left: 50%; transform: translateX(-50%); font-size: 10px; }
  .icon-prev { left: 14px;  top: 50%; transform: translateY(-50%); font-size: 10px; letter-spacing: -2px; }
  .icon-next { right: 12px; top: 50%; transform: translateY(-50%); font-size: 10px; letter-spacing: -2px; }

  /* Ripple — positioned at press location */
  @keyframes rippleSpread {
    0%   { transform: scale(0);    opacity: 0.28; }
    60%  { opacity: 0.14; }
    100% { transform: scale(2.2);  opacity: 0; }
  }
  .ripple {
    position: absolute;
    width: 60px; height: 60px;
    border-radius: 50%;
    background: rgba(80,80,90,0.22);
    animation: rippleSpread 0.55s cubic-bezier(0.2, 0.6, 0.4, 1) forwards;
    pointer-events: none;
    z-index: 4;
    margin-left: -30px;
    margin-top: -30px;
  }

  /* Center press ripple */
  @keyframes centerRipple {
    0%   { transform: translate(-50%,-50%) scale(0); opacity: 0.35; }
    100% { transform: translate(-50%,-50%) scale(1.6); opacity: 0; }
  }
  .center-ripple {
    position: absolute;
    width: 56px; height: 56px;
    top: 50%; left: 50%;
    border-radius: 50%;
    background: rgba(60,60,80,0.18);
    animation: centerRipple 0.5s cubic-bezier(0.2, 0.6, 0.4, 1) forwards;
    pointer-events: none;
    z-index: 9;
  }

  /* Progress pulse */
  @keyframes progressPulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.85; }
  }

  /* Reflection under device */
  .reflection {
    position: absolute;
    top: calc(100% + 4px);
    left: 50%; transform: translateX(-50%);
    width: 180px; height: 60px;
    background: linear-gradient(180deg,
      rgba(200,200,204,0.18) 0%,
      transparent 100%
    );
    border-radius: 0 0 40% 40%;
    filter: blur(2px);
    z-index: 0;
  }

  /* Config panel (hidden) */
  .config-panel {
    position: fixed;
    top: 16px; right: 16px;
    background: rgba(30,30,30,0.95);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 14px 16px;
    color: #ccc;
    font-size: 11px;
    font-family: 'Helvetica Neue', sans-serif;
    z-index: 100;
    min-width: 200px;
    backdrop-filter: blur(12px);
  }
  .config-panel h3 {
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    margin-bottom: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    opacity: 0.7;
  }
  .config-row {
    margin-bottom: 8px;
  }
  .config-row label {
    display: block;
    margin-bottom: 3px;
    opacity: 0.7;
  }
  .config-row input[type="text"] {
    width: 100%;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 6px;
    padding: 4px 7px;
    color: #fff;
    font-size: 10.5px;
    outline: none;
  }
  .config-row input[type="text"]:focus {
    border-color: rgba(90,160,240,0.6);
  }
  .config-row input[type="file"] {
    color: #aaa;
    font-size: 10px;
  }
  .config-apply {
    width: 100%;
    margin-top: 4px;
    background: rgba(90,160,240,0.3);
    border: 1px solid rgba(90,160,240,0.5);
    border-radius: 6px;
    color: #7ad;
    font-size: 10.5px;
    padding: 5px;
    cursor: pointer;
    letter-spacing: 0.04em;
    font-weight: 600;
  }
  .config-apply:hover { background: rgba(90,160,240,0.45); }

  .gear-btn {
    position: fixed;
    top: 16px; right: 16px;
    background: rgba(40,40,40,0.9);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    color: #aaa;
    font-size: 16px;
    width: 34px; height: 34px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    z-index: 101;
    backdrop-filter: blur(8px);
    transition: background 0.2s;
  }
  .gear-btn:hover { background: rgba(70,70,70,0.9); color: #fff; }
  .config-panel.hidden { display: none; }
</style>
</head>
<body>

<!-- Settings Gear -->
<button class="gear-btn" onclick="toggleConfig()" title="Settings">⚙</button>

<!-- Config Panel -->
<div class="config-panel hidden" id="configPanel">
  <h3>Customize</h3>
  <div class="config-row">
    <label>Song title</label>
    <input type="text" id="cfgSong" value="Bored Of Math">
  </div>
  <div class="config-row">
    <label>Artist</label>
    <input type="text" id="cfgArtist" value="The Ghost Of A Thousand">
  </div>
  <div class="config-row">
    <label>Album</label>
    <input type="text" id="cfgAlbum" value="This is where the Fight Begins">
  </div>
  <div class="config-row">
    <label>Album art URL or path</label>
    <input type="text" id="cfgArtUrl" placeholder="https://... or ./folder/img.jpg">
  </div>
  <div class="config-row">
    <label>Or upload from device</label>
    <input type="file" id="cfgArtFile" accept="image/*" onchange="handleFileUpload(this)">
  </div>
  <button class="config-apply" onclick="applyConfig()">Apply</button>
</div>

<!-- iPod -->
<div class="ipod">

  <!-- Screen -->
  <div class="screen-bezel">
    <div class="screen">

      <!-- Title bar -->
      <div class="title-bar">
        <span class="title-bar-text">Now Playing</span>
        <div class="title-bar-icons">
          <div class="play-icon" id="titlePlayIcon"></div>
          <div class="battery"></div>
        </div>
      </div>

      <!-- Now Playing content -->
      <div class="np-content">
        <div class="album-art" id="albumArt">
          <div class="album-art-fallback" id="artFallback">
            <img id="artImg" src="" alt="Album Art" style="display:none; width:100%; height:100%; object-fit:cover; position:absolute; inset:0;">
          </div>
        </div>
        <div class="np-info">
          <div class="np-label">Now Playing</div>
          <div class="np-song"  id="npSong">Bored Of Math</div>
          <div class="np-artist" id="npArtist">The Ghost Of A Thousand</div>
          <div class="np-album"  id="npAlbum">This is where the Fight Begins</div>
        </div>
      </div>

      <!-- Progress -->
      <div class="progress-area">
        <div class="progress-bar-track" id="progressTrack" onclick="seekTo(event)">
          <div class="progress-bar-fill" id="progressFill"></div>
        </div>
        <div class="progress-times">
          <span id="timeElapsed">0:00</span>
          <span id="timeRemain">-2:10</span>
        </div>
      </div>

    </div>
  </div>

  <!-- Click Wheel -->
  <div class="wheel-zone">
    <div class="click-wheel" id="clickWheel">

      <!-- Segment flash overlays (smooth press glow per zone) -->
      <div class="wheel-segment-overlay">
        <div class="seg-flash seg-top"    id="segTop"></div>
        <div class="seg-flash seg-bottom" id="segBot"></div>
        <div class="seg-flash seg-left"   id="segLeft"></div>
        <div class="seg-flash seg-right"  id="segRight"></div>
      </div>

      <!-- Labels & icons -->
      <span class="wheel-label label-menu" id="lblMenu">MENU</span>
      <span class="wheel-label label-play" id="lblPlay"></span>
      <span class="wheel-icon icon-play"   id="icoPlay">▶ ❙❙</span>
      <span class="wheel-icon icon-prev"   id="icoPrev">|◀◀</span>
      <span class="wheel-icon icon-next"   id="icoNext">▶▶|</span>

      <!-- Hit zones (pointer events for smooth feel) -->
      <button class="wheel-btn btn-menu" id="btnMenu" title="Menu"></button>
      <button class="wheel-btn btn-play" id="btnPlay" title="Play/Pause"></button>
      <button class="wheel-btn btn-prev" id="btnPrev" title="Previous"></button>
      <button class="wheel-btn btn-next" id="btnNext" title="Next"></button>

      <!-- Center button -->
      <button class="center-btn" id="centerBtn" title="Select"></button>
    </div>
  </div>

  <div class="reflection"></div>
</div>

<script>
  // ── State ──
  let playing  = true;
  let elapsed  = 30;
  let duration = 130;
  let timer    = null;

  // ── Format time ──
  function fmt(s) {
    const m = Math.floor(Math.abs(s)/60);
    const sec = Math.floor(Math.abs(s)%60);
    return (s < 0 ? '-' : '') + m + ':' + String(sec).padStart(2,'0');
  }

  function updateUI() {
    const pct = Math.min(elapsed / duration * 100, 100);
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('timeElapsed').textContent = fmt(elapsed);
    document.getElementById('timeRemain').textContent  = fmt(elapsed - duration);
  }

  function tick() {
    if (!playing) return;
    elapsed = Math.min(elapsed + 1, duration);
    if (elapsed >= duration) elapsed = 0;
    updateUI();
  }

  function startTimer() { clearInterval(timer); timer = setInterval(tick, 1000); }

  // ── Segment flash: smooth press glow ──
  const segs = {
    top:   { el: document.getElementById('segTop'),   label: document.getElementById('lblMenu') },
    bot:   { el: document.getElementById('segBot'),   label: document.getElementById('lblPlay'), icon: document.getElementById('icoPlay') },
    left:  { el: document.getElementById('segLeft'),  icon: document.getElementById('icoPrev') },
    right: { el: document.getElementById('segRight'), icon: document.getElementById('icoNext') },
  };

  let releaseTimers = {};

  function segPress(key) {
    clearTimeout(releaseTimers[key]);
    const s = segs[key];
    s.el.classList.remove('releasing');
    s.el.classList.add('active');
    if (s.label) s.label.classList.add('lit');
    if (s.icon)  s.icon.classList.add('lit');
  }

  function segRelease(key) {
    const s = segs[key];
    s.el.classList.remove('active');
    s.el.classList.add('releasing');
    if (s.label) s.label.classList.remove('lit');
    if (s.icon)  s.icon.classList.remove('lit');
    releaseTimers[key] = setTimeout(() => s.el.classList.remove('releasing'), 320);
  }

  // ── Ripple at pointer position ──
  function spawnRipple(x, y) {
    const wheel = document.getElementById('clickWheel');
    const rect  = wheel.getBoundingClientRect();
    const r = document.createElement('div');
    r.className = 'ripple';
    r.style.left = (x - rect.left) + 'px';
    r.style.top  = (y - rect.top)  + 'px';
    wheel.appendChild(r);
    setTimeout(() => r.remove(), 580);
  }

  function spawnCenterRipple() {
    const wheel = document.getElementById('clickWheel');
    const r = document.createElement('div');
    r.className = 'center-ripple';
    wheel.appendChild(r);
    setTimeout(() => r.remove(), 520);
  }

  // ── Smooth pointer binding for wheel buttons ──
  function bindWheelBtn(id, segKey, onActivate) {
    const btn = document.getElementById(id);
    let active = false;

    function down(e) {
      e.preventDefault();
      active = true;
      segPress(segKey);
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      spawnRipple(clientX, clientY);
    }

    function up(e) {
      if (!active) return;
      active = false;
      segRelease(segKey);
      onActivate();
    }

    function cancel() {
      if (!active) return;
      active = false;
      segRelease(segKey);
    }

    btn.addEventListener('pointerdown',  down,   { passive: false });
    btn.addEventListener('pointerup',    up);
    btn.addEventListener('pointerleave', cancel);
    btn.addEventListener('pointercancel',cancel);
  }

  // ── Center button physics ──
  function bindCenterBtn() {
    const btn = document.getElementById('centerBtn');
    let active = false;

    function down(e) {
      e.preventDefault();
      active = true;
      btn.classList.add('pressing');
      spawnCenterRipple();
    }

    function up() {
      if (!active) return;
      active = false;
      btn.classList.remove('pressing');
      // Trigger action after release feel
      setTimeout(() => {
        togglePlayAction();
      }, 40);
    }

    function cancel() {
      if (!active) return;
      active = false;
      btn.classList.remove('pressing');
    }

    btn.addEventListener('pointerdown',  down,   { passive: false });
    btn.addEventListener('pointerup',    up);
    btn.addEventListener('pointerleave', cancel);
    btn.addEventListener('pointercancel',cancel);
  }

  // ── Actions ──
  function togglePlayAction() {
    playing = !playing;
    document.getElementById('titlePlayIcon').style.opacity = playing ? '1' : '0.4';
    if (playing) startTimer(); else clearInterval(timer);
  }

  function prevAction() {
    elapsed = Math.max(0, elapsed - 10);
    updateUI();
  }

  function nextAction() {
    elapsed = Math.min(duration, elapsed + 10);
    updateUI();
  }

  function menuAction() {
    // Menu — visual only, no state change
  }

  // ── Bind all ──
  bindWheelBtn('btnMenu', 'top',   menuAction);
  bindWheelBtn('btnPlay', 'bot',   togglePlayAction);
  bindWheelBtn('btnPrev', 'left',  prevAction);
  bindWheelBtn('btnNext', 'right', nextAction);
  bindCenterBtn();

  // ── Seek ──
  function seekTo(e) {
    const track = document.getElementById('progressTrack');
    const rect  = track.getBoundingClientRect();
    const ratio = (e.clientX - rect.left) / rect.width;
    elapsed = Math.round(Math.max(0, Math.min(1, ratio)) * duration);
    updateUI();
  }
  document.getElementById('progressTrack').addEventListener('click', seekTo);

  // ── Config ──
  function toggleConfig() {
    document.getElementById('configPanel').classList.toggle('hidden');
  }

  function handleFileUpload(input) {
    if (!input.files || !input.files[0]) return;
    const reader = new FileReader();
    reader.onload = e => {
      document.getElementById('cfgArtUrl').value = '';
      showArt(e.target.result);
    };
    reader.readAsDataURL(input.files[0]);
  }

  function showArt(src) {
    const img = document.getElementById('artImg');
    if (src) {
      img.src = src;
      img.style.display = 'block';
      img.onerror = () => { img.style.display = 'none'; };
    } else {
      img.style.display = 'none';
    }
  }

  function applyConfig() {
    document.getElementById('npSong').textContent   = document.getElementById('cfgSong').value   || 'Unknown';
    document.getElementById('npArtist').textContent = document.getElementById('cfgArtist').value || 'Unknown';
    document.getElementById('npAlbum').textContent  = document.getElementById('cfgAlbum').value  || '';
    const url = document.getElementById('cfgArtUrl').value.trim();
    if (url) showArt(url);
    toggleConfig();
  }

  // ── Init ──
  updateUI();
  startTimer();
</script>
</body>
</html>
