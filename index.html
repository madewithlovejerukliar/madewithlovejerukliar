<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Apple MP3 Player - GitHub Edition</title>
    <style>
        :root {
            --body-grad: linear-gradient(135deg, #ffffff 0%, #e0e0e0 50%, #b8b8b8 100%);
            --screen-bg: #cbd3d6;
            --apple-blue: #3b97ee;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: radial-gradient(circle, #333 0%, #111 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .container-3d { perspective: 1000px; }

        .ipod {
            width: 320px;
            height: 540px;
            background: var(--body-grad);
            border-radius: 45px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            box-shadow: 20px 20px 60px rgba(0,0,0,0.8), inset 0 2px 3px rgba(255,255,255,0.8);
            border: 1px solid #999;
            transform: rotateX(5deg) rotateY(-5deg);
        }

        .screen-bezel {
            width: 100%;
            height: 240px;
            background: #222;
            padding: 6px;
            border-radius: 12px;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.5);
            margin-bottom: 35px;
        }

        .screen {
            width: 100%;
            height: 100%;
            background: var(--screen-bg);
            border-radius: 6px;
            overflow: hidden;
            color: #333;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .screen-header {
            display: flex;
            justify-content: space-between;
            padding: 10px 15px;
            background: linear-gradient(to bottom, #f9f9f9, #a0a0a8);
            border-bottom: 1px solid #777;
        }

        .now-playing { flex: 1; padding: 20px; display: flex; flex-direction: column; }

        .track-info-container { display: flex; gap: 15px; align-items: center; }

        /* BAGIAN ATUR GAMBAR GITHUB */
        #album-art {
            width: 100px;
            height: 100px;
            background-color: #fff;
            border: 1px solid #888;
            box-shadow: 3px 3px 8px rgba(0,0,0,0.2);
            
            /* GANTI INI: Jika file jpg ada di folder yang sama dengan html */
            background-image: url('folder_gambar/foto_kamu.jpg'); 
            
            background-size: cover;
            background-position: center;
        }

        .text-meta #song-title { font-weight: 900; font-size: 15px; }
        .text-meta #artist-name { font-size: 13px; color: #555; }

        .progress-bar {
            height: 14px;
            background: #eee;
            border: 1px solid #999;
            border-radius: 3px;
            margin-top: auto;
            overflow: hidden;
        }
        .progress-fill { width: 45%; height: 100%; background: linear-gradient(to bottom, #5cb8ff, #0076d1); }

        .wheel {
            width: 190px;
            height: 190px;
            background: #fff;
            border-radius: 50%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2), inset 0 -5px 10px rgba(0,0,0,0.1);
            border: 1px solid #ccc;
        }

        .center-button {
            width: 70px;
            height: 70px;
            background: #e6e6e6;
            border-radius: 50%;
            border: 1px solid #d1d1d1;
        }
    </style>
</head>
<body>

<div class="container-3d">
    <div class="ipod">
        <div class="screen-bezel">
            <div class="screen">
                <div class="screen-header">
                    <div style="font-size: 12px; font-weight: 800;">12:45</div>
                    <div style="width: 20px; height: 10px; border: 1px solid #444;"></div>
                </div>

                <div class="now-playing">
                    <div class="track-info-container">
                        <!-- Gambar akan muncul di sini secara otomatis -->
                        <div id="album-art"></div>
                        <div class="text-meta">
                            <div id="song-title">@JERUKLIAR</div>
                            <div id="artist-name">GitHub Album</div>
                        </div>
                    </div>

                    <div class="progress-bar">
                        <div class="progress-fill"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="wheel">
            <div style="position: absolute; top: 20px; color: #999; font-weight: bold;">MENU</div>
            <div class="center-button"></div>
        </div>
    </div>
</div>

</body>
</html>
