<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Apple MP3 Player - 3D Edition</title>
    <style>
        :root {
            --body-grad: linear-gradient(135deg, #ffffff 0%, #e0e0e0 50%, #b8b8b8 100%);
            --screen-bg: #cbd3d6;
            --apple-blue: #3b97ee;
            --wheel-bg: #f8f8f8;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: radial-gradient(circle, #333 0%, #111 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Container untuk efek perspektif */
        .container-3d {
            perspective: 1000px;
        }

        /* Body iPod dengan efek 3D */
        .ipod {
            width: 320px;
            height: 540px;
            background: var(--body-grad);
            border-radius: 45px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            /* Efek bayangan luar agar terlihat melayang */
            box-shadow: 
                20px 20px 60px rgba(0,0,0,0.8),
                -5px -5px 20px rgba(255,255,255,0.2),
                inset 0 2px 3px rgba(255,255,255,0.8);
            border: 1px solid #999;
            transform: rotateX(5deg) rotateY(-5deg);
            transition: transform 0.5s ease;
        }

        .ipod:hover {
            transform: rotateX(0deg) rotateY(0deg);
        }

        /* Layar LCD yang tenggelam (Bezel) */
        .screen-bezel {
            width: 100%;
            height: 240px;
            background: #222;
            padding: 6px;
            border-radius: 12px;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.5);
            margin-bottom: 35px;
        }

        .screen {
            width: 100%;
            height: 100%;
            background: var(--screen-bg);
            border-radius: 6px;
            overflow: hidden;
            color: #333;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.1);
        }

        .screen-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: linear-gradient(to bottom, #f9f9f9, #a0a0a8);
            border-bottom: 1px solid #777;
        }

        .header-time { font-size: 12px; font-weight: 800; }

        /* Baterai */
        .battery-body {
            width: 22px;
            height: 11px;
            border: 1.5px solid #444;
            border-radius: 3px;
            padding: 1px;
            display: flex;
        }
        .battery-level { width: 80%; height: 100%; background: #222; }

        /* Now Playing Area */
        .now-playing {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .track-info-container {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        #album-art {
            width: 100px;
            height: 100px;
            background: #eee;
            border: 1px solid #888;
            box-shadow: 3px 3px 8px rgba(0,0,0,0.2);
            background-image: url('https://via.placeholder.com/100'); /* Ganti dengan gambar anda */
            background-size: cover;
        }

        .text-meta #song-title { font-weight: 900; font-size: 15px; margin-bottom: 4px; }
        .text-meta #artist-name { font-size: 13px; color: #555; }

        /* Progress Bar */
        .progress-container { margin-top: auto; }
        .progress-bar {
            height: 14px;
            background: #eee;
            border: 1px solid #999;
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-fill {
            width: 0%; height: 100%;
            background: linear-gradient(to bottom, #5cb8ff, #0076d1);
        }

        /* 3D Click Wheel */
        .wheel {
            width: 190px;
            height: 190px;
            background: #fff;
            border-radius: 50%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            /* Efek Cekung/3D */
            box-shadow: 
                0 10px 20px rgba(0,0,0,0.2),
                inset 0 -5px 10px rgba(0,0,0,0.1),
                inset 0 5px 10px rgba(255,255,255,1);
            border: 1px solid #ccc;
        }

        .center-button {
            width: 70px;
            height: 70px;
            background: linear-gradient(145deg, #ffffff, #e6e6e6);
            border-radius: 50%;
            border: 1px solid #d1d1d1;
            z-index: 10;
            box-shadow: 
                2px 2px 5px rgba(0,0,0,0.1),
                -2px -2px 5px rgba(255,255,255,0.8);
        }

        .center-button:active {
            transform: scale(0.95);
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.1);
        }

        .wheel-label {
            position: absolute;
            font-weight: 700;
            color: #999;
            font-size: 12px;
            letter-spacing: 1px;
        }

        .menu { top: 20px; }
        .next { right: 20px; }
        .prev { left: 20px; }
        .play-pause { bottom: 20px; }

        #audio-player { display: none; }
    </style>
</head>
<body>

<div class="container-3d">
    <div class="ipod">
        <div class="screen-bezel">
            <div class="screen">
                <div class="screen-header">
                    <div class="header-time" id="real-time">12:00</div>
                    <div class="battery-body">
                        <div class="battery-level"></div>
                    </div>
                </div>

                <div class="now-playing">
                    <div class="track-info-container">
                        <div id="album-art"></div>
                        <div class="text-meta">
                            <div id="song-title">@JERUKLIAR</div>
                            <div id="artist-name">MadeWithLove</div>
                        </div>
                    </div>

                    <div class="progress-container">
                        <div class="progress-bar">
                            <div class="progress-fill" id="progress-fill"></div>
                        </div>
                        <div style="display:flex; justify-content:space-between; font-size:10px; margin-top:5px; font-weight:bold;">
                            <span id="current-time">0:00</span>
                            <span id="duration-time">-0:00</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Click Wheel 3D -->
        <div class="wheel" onclick="togglePlay()">
            <div class="wheel-label menu">MENU</div>
            <div class="wheel-label next">▶▶</div>
            <div class="wheel-label prev">◀◀</div>
            <div class="wheel-label play-pause">▶/Ⅱ</div>
            <div class="center-button"></div>
        </div>
    </div>
</div>

<audio id="audio-player" src="lovesong❤️.mp3"></audio>

<script>
    // Logika JS tetap sama dengan perbaikan visual kecil
    function updateTime() {
        const timeElement = document.getElementById('real-time');
        const now = new Date();
        timeElement.innerText = now.getHours().toString().padStart(2, '0') + ":" + 
                                now.getMinutes().toString().padStart(2, '0');
    }
    setInterval(updateTime, 1000);
    updateTime();

    const audio = document.getElementById('audio-player');
    const progressFill = document.getElementById('progress-fill');
    const currentTimeEl = document.getElementById('current-time');
    const durationTimeEl = document.getElementById('duration-time');

    function togglePlay() {
        if (audio.paused) {
            audio.play();
            document.getElementById('song-title').style.color = "var(--apple-blue)";
        } else {
            audio.pause();
            document.getElementById('song-title').style.color = "#000";
        }
    }

    function formatTime(seconds) {
        let mins = Math.floor(seconds / 60);
        let secs = Math.floor(seconds % 60);
        return mins + ":" + (secs < 10 ? '0' : '') + secs;
    }

    audio.ontimeupdate = function() {
        if (audio.duration) {
            const percentage = (audio.currentTime / audio.duration) * 100;
            progressFill.style.width = percentage + "%";
            currentTimeEl.innerText = formatTime(audio.currentTime);
            durationTimeEl.innerText = "-" + formatTime(audio.duration - audio.currentTime);
        }
    };

    audio.onloadedmetadata = function() {
        durationTimeEl.innerText = "-" + formatTime(audio.duration);
    };
</script>

</body>
</html>
