<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Apple MP3 Player - Real Time Edition</title>
    <style>
        :root {
            --ipod-bg: #e0e0e0;
            --screen-bg: #d1d1e0; /* Warna LCD Klasik */
            --apple-blue: #3b97ee;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #1a1a1a; 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
        }

        /* Body iPod */
        .ipod {
            width: 300px;
            height: 520px;
            background: linear-gradient(145deg, #f0f0f0, #c8c8c8);
            border-radius: 40px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5), inset 0 2px 5px white;
            padding: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid #aaa;
            transition: transform 0.3s ease;
        }

        /* Layar LCD */
        .screen {
            width: 100%;
            height: 230px;
            background: var(--screen-bg);
            border-radius: 4px;
            margin-bottom: 25px;
            overflow: hidden;
            color: #333;
            display: flex;
            flex-direction: column;
            border: 4px solid #222;
            position: relative; 
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
        }

        /* Header dengan Jam Real-Time */
        .screen-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: linear-gradient(to bottom, #f5f5f5, #b8b8c8);
            border-bottom: 1px solid #888;
        }

        .header-time {
            font-size: 13px;
            font-weight: 700;
            color: #000;
            letter-spacing: -0.2px;
        }

        .header-icons {
            display: flex;
            align-items: center;
        }

        /* Baterai */
        .battery-container {
            display: flex;
            align-items: center;
        }

        .battery-body {
            width: 20px;
            height: 10px;
            border: 1px solid rgba(0, 0, 0, 0.4);
            border-radius: 2.5px;
            position: relative;
            padding: 1px;
            display: flex;
            align-items: center;
        }

        .battery-level {
            width: 85%; 
            height: 100%;
            background-color: #000;
            border-radius: 1px;
        }

        .battery-cap {
            width: 1.2px;
            height: 3.5px;
            background-color: rgba(0, 0, 0, 0.4);
            margin-left: 1px;
            border-radius: 0 1px 1px 0;
        }

        .now-playing {
            flex: 1;
            padding: 15px 10px 5px 10px;
            display: flex;
            flex-direction: column;
            z-index: 2;
        }

        .track-count {
            font-size: 11px;
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
        }

        .track-info-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        #album-art {
            width: 90px;
            height: 90px;
            background-color: #fff;
            border: 1px solid #777;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
            background-image: url('icemodev2.jpg');
            background-size: cover;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .playing #album-art {
            transform: scale(1.05);
        }

        .text-meta {
            display: flex;
            flex-direction: column;
            text-align: left;
            overflow: hidden;
        }

        #song-title { 
            font-weight: 800; 
            font-size: 14px; 
            color: #000;
            margin-bottom: 2px;
            letter-spacing: -0.3px;
            transition: all 0.3s ease;
        }

        #artist-name { font-size: 12px; color: #444; opacity: 0.9; margin: 0; }

        .progress-container {
            margin-top: auto;
            padding-bottom: 8px;
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background: #e0e0f0;
            border: 1px solid #999;
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            width: 0%; 
            height: 100%;
            background: linear-gradient(to bottom, #87ceeb, #3b97ee);
        }

        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            font-weight: bold;
            margin-top: 4px;
            color: #333;
        }

        .wheel {
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, #ffffff 0%, #f0f0f0 100%);
            border-radius: 50%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1), inset 0 2px 5px white;
            cursor: pointer;
        }

        .center-button {
            width: 65px;
            height: 65px;
            background: #f8f8f8;
            border-radius: 50%;
            border: 1px solid #ddd;
            z-index: 10;
            transition: transform 0.1s;
        }

        .center-button:active { transform: scale(0.92); }

        .wheel-label {
            position: absolute;
            font-weight: bold;
            color: #bbb;
            font-size: 11px;
            user-select: none;
        }

        .menu { top: 15px; }
        .next { right: 15px; }
        .prev { left: 15px; }
        .play-pause { bottom: 15px; }

        #audio-player { display: none; }
    </style>
</head>
<body>

<div class="ipod">
    <div class="screen">
        <div class="screen-header">
            <!-- Menambahkan ID real-time untuk JavaScript -->
            <div class="header-time" id="real-time">00:00</div>
            <div class="header-icons">
                <div class="battery-container">
                    <div class="battery-body">
                        <div class="battery-level"></div>
                    </div>
                    <div class="battery-cap"></div>
                </div>
            </div>
        </div>

        <div class="now-playing">
            <div class="track-count"></div>
            
            <div class="track-info-container">
                <div id="album-art"></div>
                <div class="text-meta">
                    <div id="song-title">@JERUKLIAR</div>
                    <div id="artist-name">Made With ❤️</div>
                </div>
            </div>

            <div class="progress-container">
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <div class="time-info">
                    <span id="current-time">0:00</span>
                    <span id="duration-time">-0:00</span>
                </div>
            </div>
        </div>
    </div>

    <div class="wheel" onclick="togglePlay()">
        <div class="wheel-label menu">MENU</div>
        <div class="wheel-label next">▶▶</div>
        <div class="wheel-label prev">◀◀</div>
        <div class="wheel-label play-pause">▶/Ⅱ</div>
        <div class="center-button"></div>
    </div>
</div>

<audio id="audio-player" src="lovesong❤️.mp3"></audio>

<script>
    // --- FUNGSI JAM REAL-TIME ---
    function updateTime() {
        const timeElement = document.getElementById('real-time');
        const now = new Date();
        
        // Menggunakan Intl.DateTimeFormat untuk memastikan format waktu Indonesia (WIB)
        const options = { 
            hour: '2-digit', 
            minute: '2-digit', 
            hour12: false,
            timeZone: 'Asia/Jakarta' 
        };
        
        const timeString = new Intl.DateTimeFormat('en-GB', options).format(now);
        timeElement.innerText = timeString;
    }

    // Jalankan setiap detik
    setInterval(updateTime, 1000);
    // Jalankan langsung saat pertama kali dimuat
    updateTime();


    // --- KONTROL AUDIO ---
    const audio = document.getElementById('audio-player');
    const songTitle = document.getElementById('song-title');
    const ipod = document.querySelector('.ipod');
    const progressFill = document.getElementById('progress-fill');
    const currentTimeEl = document.getElementById('current-time');
    const durationTimeEl = document.getElementById('duration-time');

    function togglePlay() {
        if (audio.paused) {
            audio.play();
            ipod.classList.add('playing'); 
            songTitle.style.color = "#3b97ee";
        } else {
            audio.pause();
            ipod.classList.remove('playing'); 
            songTitle.style.color = "#000"; 
        }
    }

    function formatTime(seconds) {
        let mins = Math.floor(seconds / 60);
        let secs = Math.floor(seconds % 60);
        return mins + ":" + (secs < 10 ? '0' : '') + secs;
    }

    audio.ontimeupdate = function() {
        if (audio.duration) {
            const percentage = (audio.currentTime / audio.duration) * 100;
            progressFill.style.width = percentage + "%";
            currentTimeEl.innerText = formatTime(audio.currentTime);
            durationTimeEl.innerText = "-" + formatTime(audio.duration - audio.currentTime);
        }
    };

    audio.onloadedmetadata = function() {
        durationTimeEl.innerText = "-" + formatTime(audio.duration);
    };
</script>

</body>
</html>
